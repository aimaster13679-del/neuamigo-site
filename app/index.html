<style id="nm-splash-css">
#nm-splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#FFF8F6;transition:opacity .25s ease,visibility .25s}
html.nm-dk #nm-splash{background:#0A0A0D}
#nm-splash.out{opacity:0;visibility:hidden}
#nm-splash .sw{display:grid;justify-items:center;gap:22px}
#nm-splash .mk{position:relative;width:176px;height:113px;animation:nmIn .7s cubic-bezier(.2,.9,.3,1.15) both}
#nm-splash .mk img{position:relative;width:100%;height:100%;display:block}
#nm-splash .gl{position:absolute;inset:-46px -40px;border-radius:50%;background:radial-gradient(closest-side,rgba(232,140,150,.30),transparent);animation:nmGl 2.4s ease-in-out .7s infinite;pointer-events:none}
#nm-splash .sh{position:absolute;inset:0;-webkit-mask:url(img/nm-mark.png) center/contain no-repeat;mask:url(img/nm-mark.png) center/contain no-repeat;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%) -180px 0/180% 100% no-repeat;animation:nmSh 1.6s ease-in-out .55s infinite}
#nm-splash .ld{width:64px;height:4px;border-radius:9px;background:rgba(150,52,88,.14);overflow:hidden;position:relative;opacity:0;animation:nmUp .4s ease-out .6s forwards}
#nm-splash .ld i{position:absolute;top:0;bottom:0;width:40%;border-radius:9px;background:linear-gradient(90deg,#E8A39A,#C8607A);animation:nmLd 1.1s ease-in-out .6s infinite}
html.nm-dk #nm-splash .ld{background:rgba(255,255,255,.12)}
@keyframes nmIn{from{transform:translateY(10px) scale(.86);opacity:0}to{transform:none;opacity:1}}
@keyframes nmGl{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1;transform:scale(1.05)}}
@keyframes nmSh{0%{background-position:-180px 0}60%,100%{background-position:240px 0}}
@keyframes nmLd{0%{left:-40%}100%{left:100%}}
@keyframes nmUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#nm-splash *{animation:none!important}#nm-splash .ld{opacity:1}}
/* NeuAmigo opening (his ask 10 Nov 02:22: animated loading, never the square): deep navy like the app icon in both themes,
   gold mark rises in, soft gold glow breathes, a light sweep runs over the mark, thin gold loading line */
html.na-sp #nm-splash,html.na-sp.nm-dk #nm-splash{background:radial-gradient(120% 80% at 50% 38%,#1C2554 0,#0E1430 55%,#0A0F24 100%)}
html.na-sp #nm-splash .mk{width:150px;height:153px}
html.na-sp #nm-splash .gl{inset:-60px;background:radial-gradient(closest-side,rgba(232,196,110,.34),transparent)}
html.na-sp #nm-splash .sh{-webkit-mask:url(img/na-mark.png) center/contain no-repeat;mask:url(img/na-mark.png) center/contain no-repeat}
html.na-sp #nm-splash .ld{background:rgba(232,196,110,.16)}
html.na-sp #nm-splash .ld i{background:linear-gradient(90deg,#B98A2E,#F2D48A)}
/* NeuAmigo opening v2 (his ask 11 Nov 20:04 'dhabba jesa logo ... majedar'): circle reveal, 6 gold dots fly into orbit, letters rise. Fast: all within ~0.9 s */
#nm-splash .od,#nm-splash .wm,#nm-splash .tg{display:none}
html.na-sp #nm-splash .mk img{clip-path:circle(0% at 50% 50%);animation:naRv .55s .05s cubic-bezier(.3,.9,.3,1) forwards}
html.na-sp #nm-splash .od{display:block;position:absolute;left:50%;top:50%;width:0;height:0;animation:naSpin 14s linear infinite}
html.na-sp #nm-splash .od i{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFF2C6,#D1AA52 60%,#9C7426);box-shadow:0 0 12px rgba(246,222,151,.75);opacity:0;animation:naOrb .8s cubic-bezier(.3,.8,.3,1) forwards}
html.na-sp #nm-splash .wm{display:block;font:800 26px/1.2 Inter,system-ui,sans-serif;color:#fff;letter-spacing:.4px;margin-top:30px}
html.na-sp #nm-splash .wm span{display:inline-block;opacity:0;transform:translateY(12px);animation:nmUp2 .35s cubic-bezier(.2,.9,.3,1.3) forwards}
html.na-sp #nm-splash .tg{display:block;font:500 13px/1.3 Inter,system-ui,sans-serif;color:#C9CCE0;margin-top:-14px;opacity:0;animation:nmUp .4s .75s forwards}
@keyframes naRv{to{clip-path:circle(75% at 50% 50%)}}
@keyframes naSpin{to{transform:rotate(360deg)}}
@keyframes naOrb{0%{opacity:0;transform:rotate(calc(var(--a) - 160deg)) translateX(10px) scale(.3)}100%{opacity:1;transform:rotate(var(--a)) translateX(104px) scale(1)}}
@keyframes nmUp2{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){html.na-sp #nm-splash .mk img{clip-path:none}html.na-sp #nm-splash .od i,html.na-sp #nm-splash .wm span,html.na-sp #nm-splash .tg{opacity:1;animation:none!important}html.na-sp #nm-splash .od i{transform:rotate(var(--a)) translateX(104px)}}
</style>

<div id="nm-splash" aria-hidden="true"><div class="sw"><div class="mk"><span class="gl"></span><img id="nm-smk" src="img/nm-mark.png" alt=""><span class="sh"></span><span class="od"><i style="--a:0deg;animation-delay:0.05s"></i><i style="--a:60deg;animation-delay:0.10s"></i><i style="--a:120deg;animation-delay:0.15s"></i><i style="--a:180deg;animation-delay:0.20s"></i><i style="--a:240deg;animation-delay:0.25s"></i><i style="--a:300deg;animation-delay:0.30s"></i></span></div><script>try{if(true){document.documentElement.classList.add("na-sp");var i=document.getElementById("nm-smk");i.src="img/na-mark.png"}}catch(e){}</script><div class="wm"><span style="animation-delay:0.40s">N</span><span style="animation-delay:0.44s">e</span><span style="animation-delay:0.48s">u</span><span style="animation-delay:0.52s">A</span><span style="animation-delay:0.56s">m</span><span style="animation-delay:0.60s">i</span><span style="animation-delay:0.64s">g</span><span style="animation-delay:0.68s">o</span></div><div class="tg">Your new country, made easy</div><div class="ld"><i></i></div></div></div>
<script>/* opening animation (his ask 7 Nov 12:53): theme first, then the app removes it once the first screen is drawn */(function(){var d=document.documentElement,lt=true;try{var t=localStorage.getItem('nm.glassmode');lt=t?t==='light':!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)}catch(e){}if(!lt){d.classList.add('nm-dk');var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content','#0A0C0B')}
var t0=Date.now(),done=false;window.nmSplashDone=function(){if(done)return;done=true;var w=Math.max(0,750-(Date.now()-t0));setTimeout(function(){var e=document.getElementById('nm-splash');if(!e)return;e.classList.add('out');setTimeout(function(){e.remove()},260)},w)};setTimeout(window.nmSplashDone,6000)})();</script>
